name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Read by the build and again by the audit, so the gate is applied for the
    # same network the output is going to. src/lib/site.ts derives it.
    env:
      PUBLIC_SITE_BASE_URL: https://anonomi.org
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the build, so a change that breaks the pinned owner-key format
      # stops here rather than shipping. That contract is shared with
      # paylinks-api; breaking it orphans every paylink that already exists.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # No PUBLIC_PAYLINKS_API_BASE: Paylinks is an onion-only service and
          # the clearnet build must not bake in an API hostname. The previous
          # value (paylinksd.anonomi.org) points at a decommissioned host, so
          # baking it in would have the public site calling a name the project
          # no longer controls. See src/lib/paylinks.ts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Checks the output rather than the source, so the artifact is never
      # uploaded if it fails. Rules in src/lib/distAudit.ts.
      - name: Audit build output
        run: npm run audit:dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Required from v4 onwards, which stopped bundling dotfiles by
          # default. The build emits dist/.well-known/security.txt, which is
          # live at https://anonomi.org/.well-known/security.txt and would
          # otherwise disappear silently. .git and .github stay excluded
          # regardless of this setting.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        run: |
          git remote add codeberg https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/Anonomi/anonomi.org.git
          git push --mirror codeberg